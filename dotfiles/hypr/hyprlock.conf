background {
    monitor =
    color = rgba(0b0f14ee)
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(ffffff33)
    inner_color = rgba(ffffff14)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
