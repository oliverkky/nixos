gesture swipe left 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e+1" })'
gesture swipe right 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e-1" })'
gesture swipe up 3 hyprctl dispatch 'hl.dsp.window.fullscreen({ action = "set" })'
gesture swipe down 3 hyprctl dispatch 'hl.dsp.window.fullscreen({ action = "unset" })'
gesture pinch in 3 hyprctl dispatch 'hl.dsp.workspace.toggle_special("magic")'
gesture pinch out 3 hyprctl dispatch 'hl.dsp.workspace.toggle_special("magic")'
